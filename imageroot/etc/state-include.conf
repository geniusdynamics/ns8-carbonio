#
# Restic backup of the Carbonio server
#
# - secrets.env: the passwords of the LDAP service accounts
# - dump/: consistent LDAP (LDIF) and mailbox database dumps, written by
#   bin/module-dump-state and loaded by restore-module
# - the volumes: configuration, directory and database files, certificates,
#   message store and search index
#
state/secrets.env
state/dump/ldap.ldif
state/dump/mariadb.sql.gz
volumes/carbonio-conf
volumes/carbonio-data
volumes/carbonio-db
volumes/carbonio-ssl
volumes/carbonio-store
volumes/carbonio-index
